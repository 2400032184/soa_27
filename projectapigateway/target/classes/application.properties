spring.application.name=projectapigateway

server.port=8890


# ============================
# EUREKA SERVER
# ============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true


# ============================
# AUTH SERVICE
# ============================

spring.cloud.gateway.routes[0].id=auth-service

spring.cloud.gateway.routes[0].uri=lb://projectauthservice

spring.cloud.gateway.routes[0].predicates[0]=Path=/user/**


# ============================
# COMPLAINT SERVICE
# ============================

spring.cloud.gateway.routes[1].id=complaint-service

spring.cloud.gateway.routes[1].uri=lb://projectcomplaintservice

spring.cloud.gateway.routes[1].predicates[0]=Path=/complaints/**


# ============================
# ASSIGNMENT SERVICE
# ============================

spring.cloud.gateway.routes[2].id=assignment-service

spring.cloud.gateway.routes[2].uri=lb://projectassignmentservice

spring.cloud.gateway.routes[2].predicates[0]=Path=/assignments/**


# ============================
# NOTIFICATION SERVICE
# ============================

spring.cloud.gateway.routes[3].id=notification-service

spring.cloud.gateway.routes[3].uri=lb://projectnotificationservice

spring.cloud.gateway.routes[3].predicates[0]=Path=/notifications/**

# ============================
# JWT
# ============================

jwt.secret=PS027EnterpriseIssueEscalationSecretKey2026ForJWTAuthentication